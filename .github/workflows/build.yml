# Builds the APK (signed with a throwaway debug key) and runs the unit tests on every push.
name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-inter python3-pil python3-numpy
          export THEME_TOOLS=$RUNNER_TEMP/tools
          sh tools/fetch_tools.sh
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-26" "build-tools;28.0.3" > /dev/null
          cp $ANDROID_HOME/platforms/android-26/android.jar $THEME_TOOLS/
          cp $ANDROID_HOME/build-tools/28.0.3/lib/dx.jar $THEME_TOOLS/
          echo "THEME_TOOLS=$THEME_TOOLS" >> $GITHUB_ENV
      - name: Unit tests
        run: python3 build.py test
      - name: APK
        run: python3 build.py out
      - uses: actions/upload-artifact@v4
        with: { name: openrath-apk, path: out/openrath.apk }
