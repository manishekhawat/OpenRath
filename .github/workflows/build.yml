# Builds the APK (signed with a throwaway debug key) and runs the unit tests on every push.
name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    # 24.04 ships Inter 4 (with the InterDisplay faces the welcome line uses); 22.04 doesn't.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with: { distribution: temurin, java-version: '17' }
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-inter python3-pil python3-numpy
          test -f /usr/share/fonts/opentype/inter/InterDisplay-Light.otf
          export THEME_TOOLS=$RUNNER_TEMP/tools
          mkdir -p $THEME_TOOLS
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          cp $ANDROID_HOME/platforms/android-34/android.jar $THEME_TOOLS/
          cp $ANDROID_HOME/build-tools/34.0.0/lib/d8.jar $THEME_TOOLS/
          sh tools/fetch_tools.sh
          echo "THEME_TOOLS=$THEME_TOOLS" >> $GITHUB_ENV
      - name: Unit tests
        run: python3 build.py test
      - name: Nothing newer than Android 8.0 used by name
        # MIN_SDK is 26: code may only reach newer Android through Build.VERSION checks with
        # reflection or plain strings, so it has to compile against the Android 8.0 platform too
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-26" > /dev/null
          mkdir -p $RUNNER_TEMP/api26
          javac -nowarn --release 8 -encoding UTF-8 -cp $ANDROID_HOME/platforms/android-26/android.jar -d $RUNNER_TEMP/api26 $(find java -name '*.java')
      - name: APK
        run: python3 build.py out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: openrath-apk, path: out/openrath.apk }
  lint:
    # Android Lint over the code, manifest and resources. lint-baseline.xml lists the warnings that were
    # there when Lint was added; anything new fails the check. Fix one and the baseline can lose it.
    runs-on: ubuntu-24.04
    continue-on-error: true   # until the first baseline is in
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with: { distribution: temurin, java-version: '17' }
      - name: Lint
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" > /dev/null
          cat > $RUNNER_TEMP/project.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <module name="openrath" android="true" library="false" compile-sdk-version="34">
              <manifest file="$GITHUB_WORKSPACE/AndroidManifest.xml"/>
              <src file="$GITHUB_WORKSPACE/java"/>
              <resource file="$GITHUB_WORKSPACE/res"/>
            </module>
          </project>
          XML
          $ANDROID_HOME/cmdline-tools/latest/bin/lint --project $RUNNER_TEMP/project.xml --sdk-home $ANDROID_HOME \
            --baseline tools/lint-baseline.xml --html lint.html --xml lint.xml --exitcode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with: { name: lint, path: "lint.*\ntools/lint-baseline.xml" }
