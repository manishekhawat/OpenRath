# Builds the APK (signed with a throwaway debug key) and runs the unit tests on every push.
name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    # 24.04 ships Inter 4 (with the InterDisplay faces the welcome line uses); 22.04 doesn't.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with: { distribution: temurin, java-version: '17' }
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-inter python3-pil python3-numpy
          test -f /usr/share/fonts/opentype/inter/InterDisplay-Light.otf
          export THEME_TOOLS=$RUNNER_TEMP/tools
          mkdir -p $THEME_TOOLS
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          cp $ANDROID_HOME/platforms/android-34/android.jar $THEME_TOOLS/
          cp $ANDROID_HOME/build-tools/34.0.0/lib/d8.jar $THEME_TOOLS/
          sh tools/fetch_tools.sh
          echo "THEME_TOOLS=$THEME_TOOLS" >> $GITHUB_ENV
      - name: Unit tests
        run: python3 build.py test
      - name: Nothing newer than Android 8.0 used by name
        # MIN_SDK is 26: code may only reach newer Android through Build.VERSION checks with
        # reflection or plain strings, so it has to compile against the Android 8.0 platform too
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-26" > /dev/null
          mkdir -p $RUNNER_TEMP/api26
          javac -nowarn --release 8 -encoding UTF-8 -cp $ANDROID_HOME/platforms/android-26/android.jar -d $RUNNER_TEMP/api26 $(find java -name '*.java')
      - name: APK
        run: python3 build.py out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: openrath-apk, path: out/openrath.apk }
  lint:
    # Android Lint over the code, manifest and resources. Errors fail the check and are listed in the log;
    # warnings are only reported (the lint artifact's lint.html).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with: { distribution: temurin, java-version: '17' }
      - name: Lint
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" > /dev/null
          # the compiled classes, and the manifest with the SDK levels build.py gives apktool, so Lint
          # knows the oldest Android the app runs on
          L=$RUNNER_TEMP/lint && mkdir -p $L/classes
          javac -nowarn --release 8 -encoding UTF-8 -cp $ANDROID_HOME/platforms/android-34/android.jar -d $L/classes $(find java -name '*.java')
          LEVELS=$(python3 -c "import re; print(*re.search(r'MIN_SDK, TARGET_SDK = (\d+), (\d+)', open('build.py').read()).groups())")
          set -- $LEVELS
          sed "s|<application|<uses-sdk android:minSdkVersion=\"$1\" android:targetSdkVersion=\"$2\"/>\n    <application|" AndroidManifest.xml > $L/AndroidManifest.xml
          cat > $L/project.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <module name="openrath" android="true" library="false" compile-sdk-version="34">
              <manifest file="$L/AndroidManifest.xml"/>
              <src file="$GITHUB_WORKSPACE/java"/>
              <resource file="$GITHUB_WORKSPACE/res"/>
              <classes file="$L/classes"/>
            </module>
          </project>
          XML
          # Two checks are off: MissingClass can't see compiled classes in a project without Gradle (the
          # emulator runs start every class the manifest names), and a home screen has to list every app,
          # which is what QUERY_ALL_PACKAGES is for
          OFF="--disable MissingClass,QueryAllPackagesPermission"
          # reports outside the checkout: Lint would read a lint.xml in it as its settings
          $ANDROID_HOME/cmdline-tools/latest/bin/lint --project $L/project.xml --sdk-home $ANDROID_HOME $OFF \
            --html $L/report.html --xml $L/report.xml
          # then the errors on their own, readable in this log; any error fails the check
          $ANDROID_HOME/cmdline-tools/latest/bin/lint --project $L/project.xml --sdk-home $ANDROID_HOME $OFF \
            --nowarn --text stdout --exitcode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with: { name: lint, path: "${{ runner.temp }}/lint/report.*" }
