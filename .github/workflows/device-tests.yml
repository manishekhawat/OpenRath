# Runs the on-device tests (androidTest/) on an emulator: the oldest Android OpenRath supports (8.0), Android 14,
# and the one it targets (15, which draws apps under the system bars).
name: device tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34, 35]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with: { distribution: temurin, java-version: '17' }
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-inter python3-pil python3-numpy
          export THEME_TOOLS=$RUNNER_TEMP/tools
          mkdir -p $THEME_TOOLS
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          cp $ANDROID_HOME/platforms/android-34/android.jar $THEME_TOOLS/
          cp $ANDROID_HOME/build-tools/34.0.0/lib/d8.jar $THEME_TOOLS/
          sh tools/fetch_tools.sh
          echo "THEME_TOOLS=$THEME_TOOLS" >> $GITHUB_ENV
      - name: APKs
        run: |
          python3 build.py out
          python3 build.py androidtest out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d   # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          # each line runs on its own; the permissions are the ones a driver allows at first start
          script: |
            adb install -r -g out/openrath.apk
            adb install -r out/openrath-test.apk
            adb install -r out/openrath-fleet.apk
            adb shell appops set org.openrath.launcher MANAGE_EXTERNAL_STORAGE allow || true
            adb shell am instrument -w org.openrath.launcher.test/org.openrath.launcher.Smoke | tee smoke.txt
            grep -q " 0 failed" smoke.txt || (adb logcat -d -b crash; adb logcat -d -s AndroidRuntime:E TestRunner:* | tail -150; exit 1)
            adb shell dpm set-device-owner org.openrath.fleet/.Admin
            adb shell am instrument -w -e fleet set org.openrath.fleet/.Setup | tee fleet-set.txt
            grep -q "fleet set: done" fleet-set.txt
            adb shell am instrument -w -e fleet set org.openrath.launcher.test/org.openrath.launcher.Smoke | tee smoke-fleet-set.txt
            grep -q " 0 failed" smoke-fleet-set.txt || (adb logcat -d -b crash | tail -150; exit 1)
            adb shell am instrument -w -e fleet clear org.openrath.fleet/.Setup | tee fleet-clear.txt
            grep -q "fleet clear: done" fleet-clear.txt
            adb shell am instrument -w -e fleet clear org.openrath.launcher.test/org.openrath.launcher.Smoke | tee smoke-fleet-clear.txt
            grep -q " 0 failed" smoke-fleet-clear.txt || (adb logcat -d -b crash | tail -150; exit 1)
