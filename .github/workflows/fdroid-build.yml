# Builds OpenRath the way F-Droid's build server would (docs/FDROID.md): apktool built from source,
# the SDK's own aapt2 and d8, no downloaded jars, no brand packs, and no signing.
name: f-droid build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fdroid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with: { distribution: temurin, java-version: '17' }
      - name: SDK and packages
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-inter python3-pil python3-numpy
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          mkdir -p tools/.tools/framework
          cp $ANDROID_HOME/platforms/android-34/android.jar tools/.tools/
          cp $ANDROID_HOME/build-tools/34.0.0/lib/d8.jar tools/.tools/
      - name: Apktool from source
        run: |
          git clone --depth 1 --branch v2.9.3 https://github.com/iBotPeaches/Apktool.git $RUNNER_TEMP/Apktool
          cd $RUNNER_TEMP/Apktool && ./gradlew shadowJar -x test
          ls brut.apktool/apktool-cli/build/libs/
          cp "$(ls -S brut.apktool/apktool-cli/build/libs/*.jar | head -1)" $GITHUB_WORKSPACE/tools/.tools/apktool.jar
      - name: Build, unsigned
        run: |
          test ! -e tools/.tools/signer.jar
          OPENRATH_PUBLIC=1 OPENRATH_UNSIGNED=1 AAPT2=$ANDROID_HOME/build-tools/34.0.0/aapt2 python3 build.py out
      - name: Check the APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging out/openrath-unsigned.apk | head -3
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging out/openrath-unsigned.apk | grep -q "package: name='org.openrath.launcher'"
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging out/openrath-unsigned.apk | grep -q "sdkVersion:'26'"
          ! unzip -l out/openrath-unsigned.apk | grep -q "META-INF/.*\.\(RSA\|SF\)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: openrath-unsigned-apk, path: out/openrath-unsigned.apk }
