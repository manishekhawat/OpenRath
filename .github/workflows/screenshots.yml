# Screenshots of the opening logo, the setup steps, the dashboard layouts and Settings, on a 1024 x 600
# emulator like a car stereo's screen. They are kept in the run's "screenshots" artifact, and also pushed
# to refs/screenshots/<branch> so they can be fetched with git (git fetch origin refs/screenshots/<branch>).
name: screenshots
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-inter python3-pil python3-numpy
          export THEME_TOOLS=$RUNNER_TEMP/tools
          sh tools/fetch_tools.sh
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          cp $ANDROID_HOME/platforms/android-34/android.jar $THEME_TOOLS/
          cp $ANDROID_HOME/build-tools/34.0.0/lib/d8.jar $THEME_TOOLS/
          echo "THEME_TOOLS=$THEME_TOOLS" >> $GITHUB_ENV
      - name: APKs
        run: |
          OPENRATH_PUBLIC=1 python3 build.py out
          python3 build.py androidtest out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: false
          script: |
            adb shell wm size 1024x600
            adb shell wm density 160
            adb shell settings put global policy_control immersive.full=*
            adb install -r -g out/openrath.apk
            adb install -r out/openrath-test.apk
            adb shell am instrument -w org.openrath.launcher.test/org.openrath.launcher.Shots | tee shots.txt
            mkdir -p shots && adb pull /sdcard/Android/data/org.openrath.launcher/files/shots/. shots/
            ls shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
      - name: Keep the screenshots in git
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd shots
          git init -q && git checkout -q -b shots
          git add . && git -c user.name="OpenRath screenshots" -c user.email="screenshots@openrath.invalid" commit -qm "Screenshots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/screenshots/${{ github.head_ref || github.ref_name }}
