# Builds a signed public release when a tag like v1.32 is pushed (see RELEASING.md).
# It never signs with the debug key. Without the four RELEASE_* secrets it builds nothing and passes with
# a note: the release is then made by hand with an APK signed offline (RELEASING.md, "Signing offline").
# The secrets belong to the "release" environment, which only v* tags may use, so a workflow on any
# other branch can't read the key.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # 24.04 ships Inter 4 (with the InterDisplay faces the welcome line uses); 22.04 doesn't.
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with: { distribution: temurin, java-version: '17' }
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-inter python3-pil python3-numpy
          test -f /usr/share/fonts/opentype/inter/InterDisplay-Light.otf
          export THEME_TOOLS=$RUNNER_TEMP/tools
          mkdir -p $THEME_TOOLS
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          cp $ANDROID_HOME/platforms/android-34/android.jar $THEME_TOOLS/
          cp $ANDROID_HOME/build-tools/34.0.0/lib/d8.jar $THEME_TOOLS/
          sh tools/fetch_tools.sh
          echo "THEME_TOOLS=$THEME_TOOLS" >> $GITHUB_ENV
      - name: Tag matches build.py
        run: |
          TAG=${GITHUB_REF_NAME}
          VER=$(python3 -c "import re; print(re.search(r\"VERSION_NAME = \d+, '([^']+)'\", open('build.py').read()).group(1))")
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::Tag $TAG does not match VERSION_NAME $VER in build.py"
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VER=$VER" >> $GITHUB_ENV
      - name: Release key
        id: key
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::notice::No release secrets: this release is signed offline and uploaded by hand (RELEASING.md)."
            echo "SIGNED=no" >> $GITHUB_ENV
            exit 0
          fi
          echo "SIGNED=yes" >> $GITHUB_ENV
          (umask 077; echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore")
          # no passwords in the file: build.py takes them from the APK step's environment
          python3 - <<'EOF'
          import json, os
          json.dump({'keystore': os.environ['RUNNER_TEMP'] + '/release.keystore', 'alias': os.environ['KEY_ALIAS']},
                    open('signing.json', 'w'))
          EOF
      - name: Unit tests
        if: env.SIGNED == 'yes'
        run: python3 build.py test
      - name: APK
        if: env.SIGNED == 'yes'
        env:
          OPENRATH_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          OPENRATH_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: OPENRATH_PUBLIC=1 python3 build.py out
      - name: Remove the key
        if: always()
        run: rm -f signing.json "$RUNNER_TEMP/release.keystore"
      - name: Files
        if: env.SIGNED == 'yes'
        run: |
          mv out/openrath.apk "openrath-$TAG.apk"
          git archive --format=zip --prefix=openrath/ -o "openrath-$TAG-source.zip" HEAD
          sha256sum "openrath-$TAG.apk" "openrath-$TAG-source.zip" > SHA256SUMS
          cat SHA256SUMS
          python3 tools/update_json.py "openrath-$TAG.apk" "$GITHUB_REPOSITORY" > update.json
          cat update.json
      - name: Notes
        if: env.SIGNED == 'yes'
        run: |
          # the CHANGELOG section for this version, from its "## X.Y" heading to the next one
          awk -v v="$VER" '
            /^## / { if (on) exit; if ($2 == v || $2 == v ":") on = 1 }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          CERT=$($ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "openrath-$TAG.apk" \
                 | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          {
            echo
            echo "## Checking the download"
            echo
            echo '`sha256sum -c SHA256SUMS` checks the files. The APK is signed with the certificate whose SHA-256 is:'
            echo
            echo '```'
            echo "$CERT"
            echo '```'
            echo
            echo "See RELEASING.md for the steps."
          } >> notes.md
          cat notes.md
      - name: GitHub release
        if: env.SIGNED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "openrath-$TAG.apk" "openrath-$TAG-source.zip" SHA256SUMS update.json \
            --title "OpenRath $VER" --notes-file notes.md --verify-tag
